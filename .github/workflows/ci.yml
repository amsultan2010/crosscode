name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crosscode
          POSTGRES_USER: crosscode
          POSTGRES_PASSWORD: crosscode-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crosscode -d crosscode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Resolves every import in the Vercel function the way the deployment will, and loads
      # what it finds. The API returned 500 on every route for days because that import
      # pointed at a .ts file; a green build says nothing about it either way.
      - name: Serverless function imports load
        run: node scripts/check-function-imports.mjs
      # No CROSSCODE_TEST_DATABASE_URL here on purpose: `pnpm test` runs files in
      # parallel, and the PostgreSQL suites share one database. Running them that way
      # let unrelated suites interleave session and presence rows and fail sporadically.
      # They get their own serialized step below, which is what `test:postgres` is for.
      - run: pnpm test
      # `test:postgres` must cover every database-gated file, or a suite runs in no job at
      # all — which is how three tests once went unexecuted behind a hand-written file list
      # in package.json. scripts/postgres-tests.mjs keeps the selection honest without a
      # list: it selects every *.test.ts that reads CROSSCODE_TEST_DATABASE_URL (the same
      # read that makes a suite skip itself), so a new gated suite is picked up with nothing
      # to remember to edit, and it fails this step if any selected test reports as skipped
      # rather than passed. Note that vitest alone exits 0 on a fully skipped suite.
      - name: PostgreSQL integration suites
        run: pnpm test:postgres
        env:
          CROSSCODE_TEST_DATABASE_URL: postgresql://crosscode:crosscode-test-password@127.0.0.1:5432/crosscode
      # The docs site regenerates its pages from docs/*.md at build time, so a
      # broken markdown source or a renamed doc only surfaces here.
      - run: pnpm docs:build
      # The service image is the documented deploy path and nothing built it: its manifest
      # list still named apps/vscode-extension months after that directory was deleted, and
      # COPY of a missing path is a hard error, so every build failed and no job noticed.
      # Building it here is the only thing that keeps that honest.
      - name: Coordination service image
        run: docker build -f apps/service/Dockerfile -t crosscode-service:ci .
      - run: pnpm audit --audit-level high
