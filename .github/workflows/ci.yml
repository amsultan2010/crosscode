name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crosscode
          POSTGRES_USER: crosscode
          POSTGRES_PASSWORD: crosscode-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crosscode -d crosscode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CROSSCODE_TEST_DATABASE_URL: postgresql://crosscode:crosscode-test-password@127.0.0.1:5432/crosscode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --audit-level high
