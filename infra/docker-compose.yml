services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crosscode
      POSTGRES_USER: crosscode
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crosscode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosscode -d crosscode"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  crosscode-postgres:
