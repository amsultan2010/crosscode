<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crosscode: workspace dashboard</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/brand/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="/dashboard/src/style.css" />
  <script>
    // Applied synchronously before first paint to avoid a flash of the wrong
    // theme; main.ts's applyTheme() re-applies the same value once it loads.
    (function () {
      try {
        var stored = localStorage.getItem("crosscode-dashboard-theme");
        var theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch (error) { /* localStorage may be unavailable (private mode, etc.); CSS falls back to dark */ }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/dashboard">Crosscode</a>
    <nav id="app-nav" hidden></nav>
  </header>
  <main id="app"></main>
  <script type="module" src="/dashboard/src/main.ts"></script>
</body>
</html>
